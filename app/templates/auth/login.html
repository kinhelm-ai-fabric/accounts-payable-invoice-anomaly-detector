{% extends "layouts/base.html" %}
{% block title %}Login - AP Anomaly Detector{% endblock %}
{% block body_class %}page-login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <svg width="40" height="40" viewBox="0 0 28 28" fill="none">
                <rect width="28" height="28" rx="6" fill="var(--color-secondary)"/>
                <path d="M8 10h12M8 14h8M8 18h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <h2>Sign In</h2>
            <p>AP Invoice Anomaly Detector</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
</div>
{% endblock %}
